openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Career Progression Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Identity and authentication operations
  - name: careerPaths
    description: Career path operations
  - name: roles
    description: Role operations
  - name: competencies
    description: Competency operations
  - name: assessments
    description: User assessment operations
  - name: evidence
    description: Evidence for target role competencies
  - name: summary
    description: Summary and aggregation endpoints
  - name: financialTargets
    description: Financial promotion targets per role
  - name: financialProgress
    description: User financial progress against targets
  - name: probation
    description: Probation review operations
  - name: users
    description: User management operations
  - name: manager
    description: Manager view operations
  - name: teams
    description: Team management
  - name: permissions
    description: Additional permission management
  - name: audit
    description: Audit log

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/identify:
    get:
      operationId: identifyUser
      tags: [auth]
      summary: Look up a user by email address (used by employee app on first visit)
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matched user record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: No user found with that email

  /career-paths:
    get:
      operationId: listCareerPaths
      tags: [careerPaths]
      summary: List all career paths
      responses:
        "200":
          description: List of career paths
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CareerPath"
    post:
      operationId: createCareerPath
      tags: [careerPaths]
      summary: Create a career path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCareerPathBody"
      responses:
        "201":
          description: Created career path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerPath"

  /career-paths/{id}:
    get:
      operationId: getCareerPath
      tags: [careerPaths]
      summary: Get a career path by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Career path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerPath"
        "404":
          description: Not found

  /roles:
    get:
      operationId: listRoles
      tags: [roles]
      summary: List roles, optionally filtered by career path
      parameters:
        - name: careerPathId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
    post:
      operationId: createRole
      tags: [roles]
      summary: Create a role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleBody"
      responses:
        "201":
          description: Created role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"

  /roles/{id}:
    get:
      operationId: getRole
      tags: [roles]
      summary: Get a role with its full job spec and competencies
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Role with competencies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleWithCompetencies"
        "404":
          description: Not found

  /competencies:
    get:
      operationId: listCompetencies
      tags: [competencies]
      summary: List competencies for a role
      parameters:
        - name: roleId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of competencies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Competency"
    post:
      operationId: createCompetency
      tags: [competencies]
      summary: Create a competency for a role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompetencyBody"
      responses:
        "201":
          description: Created competency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competency"

  /assessments:
    get:
      operationId: listAssessments
      tags: [assessments]
      summary: List assessments for a user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
        - name: roleId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of assessments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assessment"
    post:
      operationId: upsertAssessment
      tags: [assessments]
      summary: Create or update an assessment for a competency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertAssessmentBody"
      responses:
        "200":
          description: Upserted assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"

  /evidence:
    get:
      operationId: listEvidence
      tags: [evidence]
      summary: List evidence entries for a user and role
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
        - name: roleId
          in: query
          required: false
          schema:
            type: integer
        - name: competencyId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of evidence entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evidence"
    post:
      operationId: createEvidence
      tags: [evidence]
      summary: Add an evidence entry for a competency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEvidenceBody"
      responses:
        "201":
          description: Created evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"

  /evidence/{id}:
    put:
      operationId: updateEvidence
      tags: [evidence]
      summary: Update an evidence entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEvidenceBody"
      responses:
        "200":
          description: Updated evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
    delete:
      operationId: deleteEvidence
      tags: [evidence]
      summary: Delete an evidence entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /financial-targets:
    get:
      operationId: listFinancialTargets
      tags: [financialTargets]
      summary: List financial promotion targets for a role
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of financial targets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinancialTarget"

  /financial-progress:
    get:
      operationId: listFinancialProgress
      tags: [financialProgress]
      summary: List financial progress for a user and role
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
        - name: roleId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of financial progress entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinancialProgress"
    post:
      operationId: upsertFinancialProgress
      tags: [financialProgress]
      summary: Create or update financial progress for a target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertFinancialProgressBody"
      responses:
        "200":
          description: Upserted financial progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialProgress"

  /probation/items:
    get:
      operationId: listProbationItems
      tags: [probation]
      summary: List all probation assessment items
      responses:
        "200":
          description: List of probation items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProbationItem"

  /probation/assessments:
    get:
      operationId: listProbationAssessments
      tags: [probation]
      summary: List probation assessments for a user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
        - name: reviewPeriod
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of probation assessments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProbationAssessment"
    post:
      operationId: upsertProbationAssessment
      tags: [probation]
      summary: Create or update a probation assessment item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertProbationAssessmentBody"
      responses:
        "200":
          description: Upserted probation assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbationAssessment"

  /probation/reflections:
    get:
      operationId: listProbationReflections
      tags: [probation]
      summary: List probation reflections for a user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
        - name: reviewPeriod
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of probation reflections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProbationReflection"
    post:
      operationId: upsertProbationReflection
      tags: [probation]
      summary: Create or update a probation reflection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertProbationReflectionBody"
      responses:
        "200":
          description: Upserted probation reflection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbationReflection"

  /probation/actions:
    get:
      operationId: listProbationActions
      tags: [probation]
      summary: List probation actions for a user and review period
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
        - name: reviewPeriod
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of probation actions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProbationAction"
    post:
      operationId: createProbationAction
      tags: [probation]
      summary: Create a new probation action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProbationActionBody"
      responses:
        "200":
          description: Created probation action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbationAction"

  /probation/actions/{id}:
    put:
      operationId: updateProbationAction
      tags: [probation]
      summary: Update a probation action status or text
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProbationActionBody"
      responses:
        "200":
          description: Updated probation action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbationAction"
    delete:
      operationId: deleteProbationAction
      tags: [probation]
      summary: Delete a probation action
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /probation/action-evidence:
    get:
      operationId: listProbationActionEvidence
      tags: [probation]
      summary: List evidence entries for a probation action
      parameters:
        - name: actionId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of evidence entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProbationActionEvidence"
    post:
      operationId: createProbationActionEvidence
      tags: [probation]
      summary: Add evidence against a probation action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProbationActionEvidenceBody"
      responses:
        "200":
          description: Created evidence entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbationActionEvidence"

  /probation/manager-reviews:
    get:
      operationId: listProbationManagerReviews
      tags: [probation]
      summary: List manager review summaries for a user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
        - name: reviewPeriod
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of manager review summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProbationManagerReview"
    post:
      operationId: upsertProbationManagerReview
      tags: [probation]
      summary: Create or update a manager review summary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertProbationManagerReviewBody"
      responses:
        "200":
          description: Upserted manager review summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbationManagerReview"

  /probation/manager-reviews/publish:
    post:
      operationId: publishProbationManagerReview
      tags: [probation]
      summary: Publish a manager review (making it visible to the employee)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishProbationReviewInput"
      responses:
        "200":
          description: Published review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbationManagerReview"

  /summary/readiness:
    get:
      operationId: getReadinessSummary
      tags: [summary]
      summary: Get readiness summary for a user across current and target roles
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
        - name: currentRoleId
          in: query
          required: false
          schema:
            type: integer
        - name: targetRoleId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Readiness summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessSummary"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      parameters:
        - name: managerId
          in: query
          required: false
          schema:
            type: integer
        - name: role
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
    put:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List teams
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "201":
          description: Created team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  /teams/{id}:
    get:
      operationId: getTeam
      tags: [teams]
      summary: Get a team by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          description: Not found
    put:
      operationId: updateTeam
      tags: [teams]
      summary: Update a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdate"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
    delete:
      operationId: archiveTeam
      tags: [teams]
      summary: Archive a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Archived

  /teams/{id}/members:
    get:
      operationId: listTeamMembers
      tags: [teams]
      summary: List members of a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: addTeamMember
      tags: [teams]
      summary: Add a user to a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
              required: [userId]
      responses:
        "201":
          description: Added

  /teams/{id}/members/{userId}:
    delete:
      operationId: removeTeamMember
      tags: [teams]
      summary: Remove a user from a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /hierarchy:
    get:
      operationId: getHierarchy
      tags: [users]
      summary: Get the full organisational hierarchy as a tree
      responses:
        "200":
          description: Org tree
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrgNode"

  /users/{id}/permissions:
    get:
      operationId: getUserPermissions
      tags: [permissions]
      summary: Get additional permissions granted by a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPermissions"
    put:
      operationId: setUserPermissions
      tags: [permissions]
      summary: Set additional permissions for a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPermissionsBody"
      responses:
        "200":
          description: Updated

  /users/{id}/access-summary:
    get:
      operationId: getUserAccessSummary
      tags: [permissions]
      summary: Get a summary of who a user can access and why
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Access summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessSummary"

  /audit-log:
    get:
      operationId: listAuditLog
      tags: [audit]
      summary: List audit log entries
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
        - name: requestingUserId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogEntry"

  /manager/team:
    get:
      operationId: getManagerTeam
      tags: [manager]
      summary: Get all team members for a manager
      parameters:
        - name: managerId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManagerTeamMember"

  /manager/dashboard-stats:
    get:
      operationId: getManagerDashboardStats
      tags: [manager]
      summary: Get probation dashboard stats for a manager
      parameters:
        - name: managerId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerDashboardStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    CareerPath:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
