kind = "web"
previewPath = "/manager/"
title = "Manager Dashboard"
version = "1.0.0"
id = "artifacts/manager-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/manager/" ]
localPort = 20615

[services.development]
run = "pnpm --filter @workspace/manager-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/manager-dashboard", "run", "build" ]
publicDir = "artifacts/manager-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20615"
BASE_PATH = "/manager/"
